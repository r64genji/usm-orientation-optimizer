[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usm-orientation-optimizer"
version = "0.1.0"
description = "Deterministic discrete-event crowd simulation and transit optimizer for university orientation logistics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Abraham Tan" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/r64genji/usm-orientation-optimizer"
Repository = "https://github.com/r64genji/usm-orientation-optimizer"
Issues = "https://github.com/r64genji/usm-orientation-optimizer/issues"

[project.scripts]
usm-sim = "usm_sim.__main__:main"
usm-dashboard = "operator_dashboard.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[tool.setuptools]
packages = [
    "usm_sim",
    "operator_dashboard",
    "operator_dashboard.data",
    "operator_dashboard.web.dist",
    "operator_dashboard.web.dist.assets",
]

[tool.setuptools.package-data]
operator_dashboard = ["data/*.json", "web/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: expensive benchmark optimization loops and calibration runs",
    "slow: tests taking > 5 seconds",
]
addopts = "-m 'not benchmark and not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
